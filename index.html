<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BBP SCADA Blueprint - Test</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Basit Kontrol Paneli -->
    <div id="kontrol-paneli">
        <h2 style="margin:0; font-size:14px; color:#2c3e50; text-align:center;">BBP Blueprint v4.0</h2>
        <div class="zoom-araclari" style="margin-top:10px;">
            <button id="btn-zoom-out">-</button>
            <span id="zoom-seviyesi">100%</span>
            <button id="btn-zoom-in">+</button>
        </div>
        <button id="btn-kilitle" class="kilit-acik" style="margin-top:10px; width:100%;">🔓 Konumlar Serbest</button>
        <p style="font-size:10px; color:#7f8c8d; text-align:center; margin-top:5px;">Pil Dostu Mod Aktif 🔋</p>
    </div>

    <!-- Ana Çizim Alanı -->
    <main id="fabrika-sahasi">
        <div id="sahne">
            <!-- Arka Plan Bölge Çerçeveleri (Blueprint Görünümü) -->
            <div id="bolgeler-kapsayici"></div>
            
            <!-- SVG Kablolar (Performans için tek katman) -->
            <svg id="cizim-alani"></svg>
            
            <!-- Cihaz Kutuları -->
            <div id="cihazlar-kapsayici"></div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
