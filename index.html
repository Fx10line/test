<!-- [BAŞLANGIÇ: Etkileşim Ekranları (HTML)] -->

<!-- 1. Ön Bilgi Ekranı (Genişleyen Hızlı Kart) -->
<div id="on-bilgi-paneli" class="panel-gizli">
    <div class="panel-baslik">
        <span id="on-bilgi-isim">Cihaz Adı</span>
        <button onclick="paneliKapat('on-bilgi-paneli')" class="kapat-btn">✖</button>
    </div>
    <div class="panel-icerik">
        <p class="etiket">Malzeme Zinciri:</p>
        <div class="zincir-gorseli" id="on-bilgi-zincir">
            <!-- JS ile buraya "Silo 1 ➔ Fırın 1 ➔ Makina" yazdırılacak -->
        </div>
        <p class="etiket">Aktif Materyal: <strong id="on-bilgi-materyal">-</strong></p>
    </div>
</div>

<!-- 2. Setup Ekranı (Tam Ekran Detay Modülü) -->
<div id="setup-modali" class="modal-gizli">
    <div class="modal-kutu">
        <div class="modal-baslik">
            <h2>⚙️ SETUP: <span id="setup-isim">Cihaz</span></h2>
            <button onclick="paneliKapat('setup-modali')" class="kapat-btn">✖</button>
        </div>
        <div class="modal-icerik">
            <div class="slot-alani">
                <h3>Bağlı Yuvalar (Slots)</h3>
                <ul>
                    <li><strong>Ana Giriş:</strong> Fırın 1 (PC 362.02 B)</li>
                    <li><strong>Yan Yuva 1:</strong> Kutu (Kırmızı Boya)</li>
                </ul>
            </div>
            <div class="not-alani">
                <h3>Vardiya Notları</h3>
                <textarea placeholder="Buraya not alın (Public/Private)..."></textarea>
            </div>
            <button class="kaydet-btn">Değişiklikleri Kaydet</button>
        </div>
    </div>
</div>

<!-- [BİTİŞ: Etkileşim Ekranları (HTML)] -->
